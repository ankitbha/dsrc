id: sumo_burst
kind: demand
description: >-
  Medium-high demand on inverted_tree under SUMO, interrupted by a burst of extreme
  traffic that then falls back. The scenario a controller has to be measured on: a
  shock it can absorb or fail to, rather than a steady state it can only hold.

# RE-MEASURED on the corrected road (zipper merges, task 98) with the calibrated
# Wiedemann-99 driving model. See configs/demand/sumo_saturating.yaml for the full
# fundamental diagram; the points that set this file are 900 veh/h served at 0.98 of
# offered and 22.9 m/s, which is sustainable, and 1800 served at 0.60 and 5.8 m/s,
# which is not.
#
# EVERY EARLIER FIGURE IN THIS FILE IS SUPERSEDED TWICE: once because the network's
# capacity was set by an unintended permanent yield at the merge (task 98), and once
# because the fleet used SUMO's default Krauss car following, which produces no
# capacity drop and so nothing for a controller to recover.

total_vehicles_per_hour: 900

av_penetration: 0.2

branch_split:
  main: 1.0

# The burst doubles the rate to 1800 veh/h for 150 s, twice the sustainable rate:
# at 1800 the network delivers 1100 veh/h of what is offered, a 39% deficit, and
# mean speed falls to 5.7 m/s. The window leaves 200 s of steady demand before it and
# 550 s after, so a controller is measured on three things and not one -- how it
# holds a steady state with no headroom, what it does while the network is
# overloaded, and how quickly the queue clears once the demand falls back. The last
# of those is the one a steady-state experiment cannot ask.
#
# The times are EPISODE times, measured from the first observed step, which is what
# they mean on the other simulator. The SUMO env offsets them by the warm-up.
burst:
  enabled: true
  start_s: 200.0
  end_s: 350.0
  multiplier: 2.0

# Identical to sumo_saturating: the fleet is what the config declares rather than
# the lane limit, cited in configs/training/mappo_sumo.yaml.
speed_distribution:
  mean_mps: 24.0
  std_mps: 2.5
  min_mps: 12.0
  max_mps: 32.0

# Consumed on highway_env, where it gates insertion. Not mapped on SUMO, which
# enforces insertion feasibility through its car-following model instead; mapping it
# to a vType minGap would change the standstill gap and so jam density, which is a
# different quantity. See task 88.
spawn_min_gap_m: 12.0
