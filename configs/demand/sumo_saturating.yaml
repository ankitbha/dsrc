id: sumo_saturating
kind: demand
description: >-
  Demand just past the congestion onset of inverted_tree under SUMO, so the network
  congests with a throughput deficit a controller can recover.

# RE-MEASURED on the corrected road (zipper merges, task 98) with the calibrated
# Wiedemann-99 driving model (configs/human_models/w99_calibrated.yaml). Every
# earlier figure here measured a network whose capacity was set by an unintended
# permanent yield, and a fleet whose car following had no capacity drop.
#
# Fundamental diagram, 600 s episodes after 300 s of warm-up, no AVs, dt 0.1, three
# seeds, from scripts/measure_fundamental_diagram.py:
#
#   offered   density   speed   served/h   served/offered
#       600       3.9   23.41        598             1.00
#       900       4.1   22.86        884             0.98   <- last sustainable point
#      1200       9.1   12.24        948             0.79   <- congestion onset
#      1500      18.7    7.05       1130             0.75
#      1800      26.3    5.84       1072             0.60
#      2100      33.2    5.00       1298             0.62   <- peak served flow
#      2400      46.6    3.47       1052             0.44
#      3000      67.6    2.52        992             0.33
#
# The curve now has the shape the phenomenon requires: served flow peaks and then
# FALLS, which is the capacity drop a controller holding density below critical can
# recover. With SUMO's default Krauss model on the same road the peak is 1764 veh/h
# and the drop is only 9%; with Krauss on the UNCORRECTED road there was no drop at
# all and served flow rose monotonically to 1110.

# 1200 veh/h: the congestion onset. Speed has fallen from 22.9 to 12.2 m/s and 21%
# of the offered demand is not being served, so there is a deficit to recover, while
# the network is not so far past critical that nothing can help. Measured with a
# perfect-information metering oracle at 20% penetration, five seeds: +7.6 +/- 15.2
# arrivals against no control at this level, and -20 to -39 at 1500. The sign is
# right here and wrong beyond it.
total_vehicles_per_hour: 1200

av_penetration: 0.2
branch_split:
  main: 1.0
burst:
  enabled: false
speed_distribution:
  mean_mps: 24.0
  std_mps: 2.5
  min_mps: 12.0
  max_mps: 32.0
spawn_min_gap_m: 12.0
