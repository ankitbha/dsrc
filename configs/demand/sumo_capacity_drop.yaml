id: sumo_capacity_drop
kind: demand
description: >-
  A steady demand above the road's capacity, chosen so the capacity drop happens
  inside the observed episode rather than before it. The network delivers about
  2000 veh/h for the first five minutes, then collapses to about 1200 and stays
  there.

# WHY 2400 AND NOT 3000. Measured on the two-lane inverted_tree with the calibrated
# Wiedemann-99 fleet at dt 0.1, no control, a 300 s warm-up and a 900 s episode, in
# 60 s buckets (mean speed in m/s, throughput in completions per 60 s):
#
#   minute      0     1     2     3     4     5     6     7     8    ...   14
#   2400  speed 6.6   7.2   7.0   6.8   5.9   3.6   2.8   2.3   2.2  ...  1.9
#         thr   16.3  19.8  28.0  32.1  32.7  30.5  11.6  8.3   9.0  ...  27.7
#   3000  speed 3.0   3.4   2.3   2.8   2.3   2.0   2.2   2.3   2.5  ...  1.3
#         thr   13.6  12.7  14.4  13.5  19.5  11.6  9.3   12.7  18.3 ...  13.5
#
# At 3000 the 300 s warm-up already gridlocks the road: the episode begins at 3.0
# m/s with 70% of vehicles below 0.1 m/s, and every minute of it is post-collapse.
# At 2400 the episode begins at 6.6 m/s and 33 completions per minute, collapses
# between minutes 5 and 6, and settles near 2.3 m/s. The collapse is the phenomenon
# a controller can act on, so it has to be inside the window.
total_vehicles_per_hour: 2400

# LATENT DEMAND DOES NOT ENGAGE ON THIS ROAD, and that is a property of the road
# rather than of the demand. Measured at dt 0.1 over the same episode: 0.0 pending
# vehicles at 2400 and 0.45 at 3000. Two lanes on every approach absorb the excess
# onto the carriageway instead of refusing entry, so the queue forms on the road
# and not outside it. Pending vehicles reach 181 only at 4500 veh/h, where the
# network is gridlocked from the first observed step and there is nothing to
# control. `latent_demand` stays reported, and it stays at zero here.

# 25%, which is the penetration the predecessor paper's experiments used. It is
# also more actuators: at this demand it is about 66 controllable vehicles against
# 53 at 20%.
av_penetration: 0.25

branch_split:
  main: 1.0

# No burst. The demand is above capacity at every instant; the transient is the
# road's own collapse rather than a change in what is offered.
burst:
  enabled: false

speed_distribution:
  mean_mps: 24.0
  std_mps: 2.5
  min_mps: 12.0
  max_mps: 32.0

spawn_min_gap_m: 12.0
