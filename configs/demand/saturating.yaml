id: saturating
kind: demand
description: >-
  Demand just above the capacity of inverted_tree, so the network congests without
  gridlocking. This is the operating point a controller can act on: congestion
  exists to relieve, and throughput has room to recover.
# Measured on inverted_tree, no_av, 600-step runs, 2 seeds, after the
# collision-free bound and the node-geometry fix:
#
#   veh/h    jam      speed    throughput
#    1800   0.0000    19.66    26.5   free flow, nothing to control
#    2000   0.1083    10.70    11.5   congested and moving  <-- this
#    2200   0.3867     8.66    15.5   congested, heavier
#    2700   1.0000      0.00     0.0   gridlock (measured at 900 steps)
#
# So capacity is about 1800 veh/h. `medium` (1800) sits at it and free-flows;
# `high` (2700) is far past it and the network fills and never recovers, which
# the old 120-step episode was too short to reveal. 2000 congests while still
# moving, and the throughput deficit against 1800 -- 11.5 against 26.5 -- is the
# headroom a controller has to work with.
total_vehicles_per_hour: 2000
av_penetration: 0.1
branch_split:
  main: 1.0
burst:
  enabled: false
speed_distribution:
  mean_mps: 24.0
  std_mps: 2.5
  min_mps: 12.0
  max_mps: 32.0
spawn_min_gap_m: 12.0
