id: sumo_oversaturated
kind: demand
description: >-
  Demand far above the network's peak capacity, held steady. The network saturates,
  throughput settles at whatever the road can serve, and the rest of the demand
  queues outside it as latent demand. No burst: the shock is that the demand never
  stops.

# WHY THIS SHAPE. A burst scenario measures a controller on one transient, and the
# timing of that transient is a design choice that can flatter or punish it. Holding
# demand above capacity removes the choice: the network reaches a steady saturated
# state and a controller is measured on two numbers that must move together in the
# right direction -- more vehicles served, and fewer left unable to enter.
#
# The accounting is complete by construction. Every scheduled vehicle is either
# served (arrived), on the road, or latent (waiting to enter, held by SUMO with no
# departure deadline so none is discarded). A controller that raises throughput
# without lowering latent demand has moved vehicles from the road into the queue,
# and the two metrics together make that visible.

# 3000 veh/h against a peak served flow of about 1300, so roughly 2.3x capacity.
# Measured at this rate with no AVs: the road holds about 480 vehicles once
# saturated, serves about 1150 veh/h, and accumulates latent demand at roughly 0.44
# vehicles per second thereafter.
total_vehicles_per_hour: 3000

# 20% for now. This is the fraction of the vehicles that DO get on the road, not of
# the offered demand, and it is the knob to raise if 20% proves too few actuators to
# measure anything.
av_penetration: 0.2

branch_split:
  main: 1.0

# No burst. The demand is already past capacity at every instant.
burst:
  enabled: false

speed_distribution:
  mean_mps: 24.0
  std_mps: 2.5
  min_mps: 12.0
  max_mps: 32.0

spawn_min_gap_m: 12.0
