id: mappo_sumo
kind: training
description: >-
  MAPPO on SUMO, at the demand just past inverted_tree's junction-limited capacity.
  Same sensing profile and reward weights as mappo_deploysense; only the simulator
  and the demand differ, so a difference in outcome is attributable to the road.

# SUMO rather than highway_env, because SUMO's car-following cannot produce a
# collision: the safe speed is the model rather than a cap applied over it. Measured
# on the same 3-into-1 merge that broke highway_env, at three times capacity for
# 1800 steps with 134 vehicles present, zero collisions. It is also what Vinitsky
# et al. and the Flow benchmarks run on.
simulator: sumo

# 0.1 s, not the 1.0 s the trainer defaults to. The deployment's end-to-end sensing
# latency was measured at p50 96.7 ms over 22,929 ticks, and it could not be
# represented at all at a 1 s step: `SensingBuffer.frame_for_latency` selects whole
# recorded frames and the buffer records once per step, so ANY value in (0, 1.0]
# imposed a full second and overstated the measurement tenfold. It was pinned at 0,
# understating it by 97 ms. At dt 0.1 a `latency_s` of 0.1 selects the frame one
# step back and represents the measured p50 almost exactly.
#
# It also puts the policy's decision rate at 10 Hz rather than 1 Hz, against the
# deployed loop's 30 Hz tick.
#
# EVERY quantity below that is expressed in steps rather than seconds moves with
# this: warmup_steps, duration_steps, rollout_steps, gamma, gae_lambda and
# reward_scale. Each is annotated with the invariant it preserves.
dt: 0.1

# Let the network fill before the episode is observed. A vehicle must cover
# 500 + 600 + 900 m before it can arrive, so nothing completes for the first
# hundred seconds and a rollout beginning at t = 0 can see no AV at all.
# 3000 steps at dt 0.1 is the same 300 s of warm-up as 300 steps at dt 1.0.
warmup_steps: 3000

# 6000 steps at dt 0.1 is a 600 s episode. What it has to contain is the road's own
# capacity collapse, which happens between minutes 5 and 6 after the 300 s warm-up
# at this demand; 600 s covers the approach to it, the collapse, and four minutes
# after. The previous 900 s ended in five minutes of gridlock in which nothing a
# controller does changes anything, which diluted the signal and cost a third of the
# wall clock. The trajectory is in configs/demand/sumo_capacity_drop.yaml.
#
# THE EPISODE LENGTH IS PART OF THE OPERATING POINT, not a free parameter: the mean
# team reward per step, the mean speed and the throughput all move with it, because
# the network fills as the episode runs. Any statement of the form "the team reward
# is about X" needs the episode length attached to it.
#
# TWO EARLIER ARM TABLES ARE RETRACTED and are not reproduced here. They recorded a
# 17.6% throughput gain from holding AVs at 10 m/s. It was an artefact of the 1 s
# physics step: across dt 1.0 to 0.05 the commanded arm moved 6.4 arrivals, inside
# its own standard deviation, while the uncommanded arm rose 31%, so at a converged
# step size holding AVs at 10 m/s LOWERS throughput by 4 to 7%. Full tables and the
# retraction are in plans/plan_task_84_sumo_simulator.md and task 92.
duration_steps: 6000

# The calibrated Wiedemann-99 driving model, NOT SUMO's default Krauss. Krauss
# computes a collision-free safe speed exactly and recovers from a disturbance
# immediately, so it produces no capacity drop and there is nothing for a controller
# to recover: a perfect-information oracle could not beat inaction under it. The
# parameters come from the predecessor paper's own calibration appendix
# (arXiv:2506.11973, Appendix A), which tuned them for exactly this reason.
human_model: w99_calibrated

# The one topology section C is scoped to.
topology: inverted_tree

# A steady demand above capacity, at the rate where the road's collapse happens
# inside the observed episode. The burst scenario is retired here: its transient was
# a change in what was offered, and the timing of that transient was a design choice
# that could flatter or punish a controller. The transient now belongs to the road.
# Measured with no AVs at dt 0.1: 33 completions per minute and 6.6 m/s for the
# first five minutes, then a collapse to 2.3 m/s and about 12 completions per
# minute. See configs/demand/sumo_capacity_drop.yaml for the trajectory and for why
# 3000 veh/h is the wrong rate -- at 3000 the warm-up alone gridlocks the road.
demand: sumo_capacity_drop

algorithm: mappo
policy_mode: ctde
# speed_headway, not full. The full profile has four heads and 81 combinations, of
# which the lane-preference and merge-mode heads act through SUMO's DEFAULT
# lane-change model (LC2013, every eagerness parameter at 1.00): nothing in this
# project calibrates lane changing, and the predecessor paper's appendix calibrates
# car following only, because its action space was speed modulation alone.
#
# Dropping them does three things at once. It aligns the action space with the
# dynamics that ARE calibrated; it matches the actuation the predecessor's result was
# obtained with; and it cuts the action space from 81 to 9, which is a direct attack
# on the learning problem, since both exploration and per-action credit scale with
# it. The lane head can come back when there is a source to calibrate lane changing
# against.
action_profile: speed_headway
total_updates: 25
# THREE episodes per update, not one. `collect_rollout` resets on truncation and
# keeps collecting until `rollout_steps`, so 27000 steps at a 9000-step episode is
# three episodes averaged into one gradient.
#
# The previous run learned nothing: entropy ended at 99.1% of its maximum and the
# score was flat across all 100 updates (task 96). The diagnosis was that with a
# team reward shared among about twelve agents, one agent's action moves the reward
# by far less than the noise in it, so a gradient estimated from a single episode is
# dominated by that noise. Flow's benchmarks, which this project is measured
# against, average 50 rollouts per iteration for 500 iterations
# (Vinitsky et al. 2018); one rollout per update is 1/50th of their gradient
# quality, and 100 updates 1/5th of their count.
#
# Three is what the wall clock allows: with the episode at 900 s and five seeds in
# parallel this costs about the same as the previous 100 single-episode updates, so
# `total_updates` drops to 50 in exchange. The trade is deliberate -- a smaller
# number of much less noisy updates, for a policy whose problem was noise rather
# than step count.
# 1800 DECISIONS, not simulation steps. `decision_interval_s` below makes one
# decision per simulated second, so a 6000-step episode is 600 decisions and this is
# the same three episodes per update as before.
rollout_steps: 1800

# ONE DECISION PER SIMULATED SECOND, holding the action for the ten simulation steps
# in between. `setSpeed` and `setTau` persist in SUMO until they are changed, so the
# action is issued once and stays in force.
#
# WHY. Both SUMO training runs produced no learning, and the diagnosed cause is the
# credit-assignment signal (task 96). At dt 0.1 the step size dilutes it before the
# team reward divides it: a single action changes the next observation almost not at
# all, so the advantage it earns is dominated by the noise around it. Holding the
# action for a second gives each decision ten times the effect on the state that
# follows it, and cuts the number of transitions per episode by the same factor.
#
# The simulation still integrates at dt 0.1. This changes what the controller does,
# not what the traffic does, so an uncontrolled baseline is unaffected and the
# comparison against it is unchanged.
#
# `gamma` and `gae_lambda` below are expressed in DECISIONS and move with this.
decision_interval_s: 1.0

# Every value here has a named source. `src/sensing/local.py` reads exactly these
# five plus the bin edges, and they define the actor's entire input distribution.
sensing:
  # Optics, not measurement. fx_px is 800 on the rotated frame, so a 1.8 m wide
  # vehicle spans 20 px at 72 m and 14.4 px at 100 m. The 150 m library default
  # puts it at 9.6 px, which is past what the detector resolves. 100 m is the
  # optimistic end of the defensible band and is what shared_ppo_deploysense
  # already used.
  # PENDING: task 9 replaces this with the replay measurement over the recorded
  # video, which needs the Jetson's TensorRT detector and so cannot be done from
  # the laptop.
  range_m: 100.0

  # Measured: end-to-end latency over 22,929 ticks on 2026-09-08 was p50 96.7 ms,
  # mean 112.4 ms, p95 172.9 ms, p99 276.4 ms.
  #
  # 0.1 s represents the p50 almost exactly. `SensingBuffer.frame_for_latency`
  # selects whole recorded frames and the buffer records once per step, so at dt 0.1
  # this selects the frame from one step -- 100 ms -- earlier. It was pinned at 0
  # while dt was 1.0, because at that step size any positive value imposed a full
  # second and overstated the measurement tenfold; the sensing delay was unmodelled
  # rather than represented. The step size was changed for this reason.
  #
  # It is the p50, not the mean or the p95: the buffer holds whole frames, so the
  # delay is a whole number of steps and the distribution's spread is not
  # representable at all. p50 96.7 ms rounds to one step; the p95 of 172.9 ms would
  # round to two.
  latency_s: 0.1

  # NOT measured on this vehicle, and not measurable from these drives:
  # calibrating detection noise needs an independent measurement of other
  # vehicles' true position and speed, and the vehicle carried no radar, no lidar
  # and no second instrumented car. These must never be described as measured
  # here.
  #
  # CITED instead, from Song, Lu, Zhang and Li, "End-to-end Learning for
  # Inter-Vehicle Distance and Relative Velocity Estimation in ADAS with a
  # Monocular Camera", ICRA 2020 (arXiv:2006.04082), evaluated on the TuSimple
  # velocity benchmark. That paper measures exactly this pair of quantities for
  # exactly this sensor -- a forward monocular camera estimating other vehicles'
  # distance and relative velocity -- and reports, for its full model:
  #
  #   position MSE 10.23 m^2                      -> RMSE 3.20 m
  #   velocity MSE 0.86 m^2/s^2 (range-averaged)  -> RMSE 0.93 m/s
  #
  # Its velocity error is range-resolved, and our 100 m sensing range spans all
  # three of its groups: MSE 0.15 near (< 20 m), 0.34 medium (20-45 m), 2.09 far
  # (> 45 m), which are RMSE 0.39, 0.58 and 1.45 m/s. The range-averaged 0.93 is
  # taken rather than the near-range figure because most observed vehicles are
  # beyond 45 m at a 100 m range.
  #
  # These are the errors of a state-of-the-art LEARNED method. This rig runs
  # YOLOv8n with pinhole geometry and vehicle-width priors, which is simpler and
  # will not beat them, so treat the values as a floor on the noise rather than an
  # estimate of it. The previous values, 1.5 m and 0.15 m/s, were carried over
  # from shared_ppo_deploysense with no source and are optimistic against this
  # citation by roughly 2x on position and 6x on speed.
  #
  # Corroborating, for speed only and from a different setup (roadside camera,
  # homography, validated against a GNSS and IMU reference vehicle): Bell et al.,
  # "Accurate Vehicle Speed Estimation from Monocular Camera Footage", ISPRS
  # Annals V-2-2020, average RMSE 0.625 m/s over four experiments, range 0.130 to
  # 1.171 m/s.
  #
  # Measured after setting them, against a noise-free run on the same seed: the
  # injected error on `leader_gap` has a standard deviation of 3.00 m and on
  # `leader_relative_speed` 0.70 m/s over 376 paired observations.
  position_noise_std: 3.2
  speed_noise_std: 0.93

  # FALSE as of task 103, and this is a deliberate step away from the deployment.
  #
  # The parity ledger classifies six of the 39 observation slots as structurally
  # absent -- every rear-facing field, since the live vehicle list is forward-camera
  # derived and there is no rear sensor -- and seven more as substituted with a
  # constant. With this true the actor learns from 26 of 39 inputs.
  #
  # The question this run asks is whether a decentralised policy can be learned on
  # this environment at all. Masking a third of the observation is a sim-to-real
  # transfer constraint, and transfer is deferred work; imposing it while the prior
  # question is unanswered confounds "the policy cannot learn" with "the policy
  # cannot learn from what the rig can sense". It goes back to true before any claim
  # about the deployed vehicle is made.
  deployed_fidelity: false

  # The library default, and the drive supports it rather than contradicting it:
  # ego speed over 17,913 moving ticks is bimodal, with a stop-and-go mass below
  # about 6 m/s and a cruise mode at 22-26 m/s.
  queue_speed_mps: 5.0

# Throughput leads the objective, because that is what the replication claims, and
# delay and smoothness are now priced beside it, because those are the axes the
# predecessor paper's gains were largest on and this environment did not measure
# them at all before task 103.
#
# EVERY WEIGHT BELOW WAS SET FROM A MEASUREMENT, taken before the run rather than
# after it: one uncontrolled episode at this demand, this fleet, this warm-up and
# this length, at dt 0.1. The metric's mean over the episode is in the first column
# and the contribution the weight gives it in the second.
#
#   metric                     mean     weight    contribution
#   throughput_recent          18.88     0.10        +1.89
#   mean_speed                  3.88     0.05        +0.19
#   fairness_jain               0.82     0.50        +0.41
#   jam_fraction                0.585   -1.00        -0.59
#   stopped_fraction            0.467   -1.00        -0.47
#   mean_delay_recent         317.5     -0.002       -0.64
#   speed_std                   6.79    -0.05        -0.34
#   mean_abs_jerk               0.211   -0.50        -0.11
#   hard_braking_count          0.338   -0.10        -0.03
#   rolling_roadblock_score     0.0003  -2.00        -0.00
#   queue_length_total        215.8      0.00         0.00
#                                                   ------
#                                                   +0.91
#
# No term is more than five times another except throughput, which leads
# deliberately. The total is positive and of order 1, which is what PPO's default
# coefficients assume.
#
# queue_length_total IS ZEROED, and this is the one weight that is a change of
# objective rather than a rescaling. It is an unnormalised count of queued vehicles
# summed over segments, so at this operating point the library's -0.02 gives it
# -4.32 -- larger in magnitude than every other term combined and larger than the
# total. It measures the same congestion as jam_fraction and stopped_fraction, both
# of which are normalised by the network rather than growing with it. Keeping the
# normalised pair and dropping the raw count is a decision taken before the run and
# recorded here; it is not a term removed because a result depended on it.
#
# mean_speed is NOT zeroed, and neither is it large. throughput_recent counts
# completions in a 60 s rolling window and mean_delay_recent is a mean over the
# trips that completed in it, so both are gaps on a step where nothing completed;
# the speed term is what provides a gradient in between.
reward_weights:
  throughput_recent: 0.10
  mean_speed: 0.05
  fairness_jain: 0.50
  jam_fraction: -1.0
  stopped_fraction: -1.0
  mean_delay_recent: -0.002
  speed_std: -0.05
  mean_abs_jerk: -0.5
  hard_braking_count: -0.1
  rolling_roadblock_score: -2.0
  queue_length_total: 0.0

# THE PER-AGENT TERM, over the agent's own segment and the segments downstream of
# it. `local_reward_weight` under `optimization` is how much of each agent's reward
# comes from here rather than from the team reward above.
#
# Same three quantities as the team reward's leading terms, measured near the agent
# instead of over the network, so the two are the same objective at two scales and
# blending them is meaningful. `outflow_recent` is the local analogue of
# `throughput_recent`: how many vehicles the neighbourhood passed downstream in the
# same 60 s window.
#
# Measured on the same uncontrolled episode, averaged over agents and steps:
#
#   metric              mean    weight   contribution
#   outflow_recent      11.56    0.10       +1.16
#   mean_speed           8.63    0.05       +0.43
#   jam_fraction         0.569  -1.00       -0.57
#                                          ------
#                                          +1.02
#
# +1.02 against the team reward's +0.91, so a blend of 0.5 is a mixture of two
# quantities of the same magnitude and the blend weight means what it says.
#
# The neighbourhood INCLUDES the downstream segments, which is the environment's
# decision and is documented at SumoTopologyEnv.neighbourhood_metrics. Speed
# metering means holding the own segment below free flow to relieve the next one, so
# an own-segment-only term would penalise the mechanism this project exists to
# study.
local_reward_weights:
  outflow_recent: 0.10
  mean_speed: 0.05
  jam_fraction: -1.0

actor:
  observation_scope: local
  hidden_sizes:
    - 128
    - 128
critic:
  observation_scope: global
optimization:
  learning_rate: 0.0003
  # Both are horizons expressed in DECISIONS, and `decision_interval_s` makes a
  # decision one simulated second. 1/(1-gamma) is 100 decisions, so 100 s, which is
  # the horizon the 0.999 of the previous configuration bought at ten decisions a
  # second. The horizon is unchanged; only the unit is.
  gamma: 0.99
  # 1/(1-lambda) is the advantage-averaging horizon, 20 decisions, so 20 s. Same
  # reasoning.
  gae_lambda: 0.95
  clip_coef: 0.2
  value_coef: 0.5
  entropy_coef: 0.01
  max_grad_norm: 0.5
  update_epochs: 4
  minibatch_size: 256
  # 0.1 at dt 0.1, which is 1.0 at dt 1.0 -- the scale is per step and the step
  # changed, so this keeps the reward's integral over an episode the same. Without
  # it a 6000-step episode at gamma 0.999 gives value targets ten times larger than
  # a 600-step episode at gamma 0.99, and the value loss is a mean squared error on
  # them, so it would grow a hundredfold and dominate the objective.
  #
  # WHY THE SCALE MATTERS, AND WHAT IT DOES NOT AFFECT. `compute_returns_and_advantages`
  # normalises advantages by default, and `policy_loss` is computed from those, so
  # the policy gradient is invariant to this scale. Only `value_loss` sees it,
  # through unnormalised returns. Task 85's argument -- that at scale 0.05 the
  # entropy bonus of 0.042 was 66% of the objective and left the policy no incentive
  # to become deterministic -- compared the bonus against the raw reward, which is
  # not what the policy loss is built from. That explains the measured outcome:
  # changing the scale moved entropy only from -0.025 to +0.021 over 400 updates.
  # Task 85's arithmetic was right and the quantities it compared were not.
  #
  # CORRECTED 2026-09-09 from a second independent audit. This block previously
  # recorded a team reward of "mean +0.2737, min -0.6442, max +0.9489" over 300
  # steps, which reproduces under no combination of episode length and warm-up: the
  # measured values are +1.1165 at 300 steps with a 300-step warm-up, +1.5451 with
  # none, and +0.8313 over 600 steps -- and the last of those is the figure the
  # header of this file quotes, so the two statements contradicted each other. It
  # also claimed queue_length_total was the largest single term at -1.30; measured
  # over 300 steps the contributions are throughput_recent +1.2437, mean_speed
  # +0.5825, queue_length_total -0.4497, fairness_jain +0.3767, speed_std -0.2192,
  # jam_fraction -0.2083, hard_braking_count -0.1083. Throughput exceeds queue
  # length by a factor of 2.8.
  #
  # All of those figures were measured at dt 1.0 and are superseded by the dt 0.1
  # re-measurement recorded in plans/plan_task_84_sumo_simulator.md.
  # 0.1 per SIMULATION step, and the reward summed over a decision's ten steps is
  # scaled by it once, so a decision carries about 0.91 and the value targets have
  # the same magnitude they had at one decision per step with gamma 0.999. The
  # scale did not have to change when the decision rate did.
  reward_scale: 0.1
  reward_clip: 10.0
  crash_penalty: 2.0
  # HALF of each agent's reward is measured over its own neighbourhood. The whole
  # point of task 103: with the team reward alone, one agent among about 66 moves
  # the reward by far less than the noise in it over a 20 s advantage horizon, which
  # is what both earlier runs measured and what stopped either from learning.
  #
  # 0.5 rather than a smaller value because the diagnosis is that the team signal is
  # not merely weak but below the noise, so a small local admixture would not clear
  # it; and rather than 1.0 because at 1.0 nothing in the objective refers to the
  # network and there is no reason for an agent to help a segment it is not in.
  #
  # It does NOT change what the deployed vehicle sees. The term is used to compute a
  # reward during training; the actor reads the local observation alone.
  local_reward_weight: 0.5
