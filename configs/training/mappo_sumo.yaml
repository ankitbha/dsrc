id: mappo_sumo
kind: training
description: >-
  MAPPO on SUMO, at the demand just past inverted_tree's junction-limited capacity.
  Same sensing profile and reward weights as mappo_deploysense; only the simulator
  and the demand differ, so a difference in outcome is attributable to the road.

# SUMO rather than highway_env, because SUMO's car-following cannot produce a
# collision: the safe speed is the model rather than a cap applied over it. Measured
# on the same 3-into-1 merge that broke highway_env, at three times capacity for
# 1800 steps with 134 vehicles present, zero collisions. It is also what Vinitsky
# et al. and the Flow benchmarks run on.
simulator: sumo

# reward_scale 1.0, not the 0.05 the other configs use. At the SUMO operating point
# the team reward is about 1.28; scaled by 0.05 it becomes 0.064, while the entropy
# bonus at entropy_coef 0.01 and the entropy the policy actually held (4.24) is
# 0.042 -- 66% of the objective. The policy therefore had almost no incentive to
# become deterministic and held 91% of maximum entropy after 400 updates. PPO's
# default coefficients assume a reward of order 1, and reward_clip at 10 already
# bounds the magnitude, so scaling down was not protecting anything.

# Let the network fill before the episode is observed. A vehicle must cover
# 500 + 600 + 900 m before it can arrive, so nothing completes for the first
# hundred seconds and a rollout beginning at t = 0 can see no AV at all.
warmup_steps: 300

# 600, not the 120 the trainer defaults to. The effect this configuration exists to
# learn -- AVs holding a speed below free flow to raise throughput through the
# junction -- does not exist at 120 steps. Arrivals against an uncommanded fleet at
# the same demand, means over seeds:
#
#   episode length   uncommanded   AVs held at 10 m/s   seeds
#         120 steps          22.0                 19.7       3   no gain
#         300 steps          56.0                 76.3       3   +36%
#         600 steps    111.8 +/- 1.5     143.0 +/- 18.4       5   +28%
#
# The 600-step spread is what the earlier single-seed figures hid: 167 against 110
# arrivals was one seed at the top of an 18.4-wide distribution, not a 52% effect.
#
# The mean team reward moves with the horizon for the same reason: +0.60 per step
# uncommanded at 120 steps against -0.01 at 600, because `jam_fraction` at weight
# -2.0 rises as the network fills. At 120 steps the reward RANKS 30 m/s above
# 10 m/s, the reverse of the arrival ranking over the longer horizon, so training
# at the default length would have optimised against the effect under study.
duration_steps: 600

# The one topology section C is scoped to.
topology: inverted_tree

# 1050 veh/h, past the ~900 veh/h knee where arrivals peak. See the config file for
# the sweep.
demand: sumo_saturating

algorithm: mappo
policy_mode: ctde
action_profile: full
total_updates: 100
rollout_steps: 512

# Every value here has a named source. `src/sensing/local.py` reads exactly these
# five plus the bin edges, and they define the actor's entire input distribution.
sensing:
  # Optics, not measurement. fx_px is 800 on the rotated frame, so a 1.8 m wide
  # vehicle spans 20 px at 72 m and 14.4 px at 100 m. The 150 m library default
  # puts it at 9.6 px, which is past what the detector resolves. 100 m is the
  # optimistic end of the defensible band and is what shared_ppo_deploysense
  # already used.
  # PENDING: task 9 replaces this with the replay measurement over the recorded
  # video, which needs the Jetson's TensorRT detector and so cannot be done from
  # the laptop.
  range_m: 100.0

  # Measured: end-to-end latency over 22,929 ticks on 2026-09-08 was p50 96.7 ms,
  # mean 112.4 ms, p95 172.9 ms, p99 276.4 ms.
  #
  # It is deliberately left at 0. `SensingBuffer.frame_for_latency` selects whole
  # recorded frames and the buffer records once per step, so at dt = 1.0 s ANY
  # value in (0, 1.0] selects the frame from a full second earlier. Setting the
  # measured 0.097 would impose a 1000 ms delay, overstating it tenfold; leaving
  # it at 0 understates by 97 ms. The smaller error is the honest one, and the
  # real sensing delay is unmodelled at this step size rather than represented.
  latency_s: 0.0

  # NOT measured, and not measurable from these drives: calibrating detection
  # noise needs an independent measurement of other vehicles' true position and
  # speed, and the vehicle carried no radar, no lidar and no second instrumented
  # car. Carried over from shared_ppo_deploysense.
  # OPEN: these two need a citation to a published characterisation of monocular
  # bounding-box ranging before the paper quotes them. They must not be described
  # as measured on this vehicle.
  position_noise_std: 1.5
  speed_noise_std: 0.15

  # Present only what the rig can sense. The parity ledger classifies six of the
  # 39 observation slots as structurally absent -- every rear-facing field, since
  # the live vehicle list is forward-camera derived and there is no rear sensor --
  # and seven more as substituted with a constant. Without this the actor learns
  # from 13 of 39 inputs the deployed vehicle cannot produce.
  deployed_fidelity: true

  # The library default, and the drive supports it rather than contradicting it:
  # ego speed over 17,913 moving ticks is bimodal, with a stop-and-go mass below
  # about 6 m/s and a cruise mode at 22-26 m/s.
  queue_speed_mps: 5.0

# Throughput leads the objective, because that is what the replication claims.
#
# Balanced at the saturating operating point measured on inverted_tree at 2000
# veh/h: mean_speed 10.70, throughput_recent 11.5, jam_fraction 0.108,
# fairness_jain 0.885. With the library defaults those give mean_speed 44% of the
# positive reward and throughput 19%. Raising throughput_recent from 0.02 to 0.10
# makes it 54%, against mean_speed 25% and fairness 21%.
#
# mean_speed is NOT zeroed. throughput_recent counts completions in a 60 s rolling
# window and is zero on most early steps, so it is a sparse signal; the speed term
# is what provides a gradient in between.
#
# jam_fraction doubles to -2.0 so relieving congestion pays. At 0.108 it is still
# only a -0.216 contribution, which is the right order: congestion is the thing to
# relieve, not the thing to be scored on.
reward_weights:
  throughput_recent: 0.10
  jam_fraction: -2.0

actor:
  observation_scope: local
  hidden_sizes:
    - 128
    - 128
critic:
  observation_scope: global
optimization:
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_coef: 0.2
  value_coef: 0.5
  entropy_coef: 0.01
  max_grad_norm: 0.5
  update_epochs: 4
  minibatch_size: 256
  # 1.0, not the 0.05 the other configs use. At the SUMO operating point the team
  # reward is about 1.28; scaled by 0.05 it becomes 0.064, while the entropy bonus
  # at entropy_coef 0.01 and the entropy the policy actually held (4.24) is 0.042 --
  # 66% of the objective. The policy therefore had almost no incentive to become
  # deterministic and held 91% of maximum entropy after 400 updates. PPO's default
  # coefficients assume a reward of order 1, and reward_clip already bounds the
  # magnitude, so scaling down was not protecting anything.
  # CORRECTED 2026-09-09 from an independent audit. The note above claimed a team
  # reward of "about 1.28", which does not reproduce. Measured over 300 steps at the
  # operating point after the metric fixes: mean +0.2737, min -0.6442, max +0.9489.
  # The largest single term is queue_length_total at -0.020 x 65 = -1.30, larger in
  # magnitude than throughput's +1.20, and the earlier note did not mention it.
  #
  # The decision holds on the corrected numbers, less dramatically: at scale 0.05 the
  # reward would be 0.014 against an entropy bonus of 0.042, three times the
  # objective; at 1.0 the bonus is about 15% of it.
  #
  # Changing this did NOT make the policy converge -- entropy went -0.025 to +0.021
  # across 400 updates -- because the binding constraints were elsewhere: the action
  # bins cannot reach the effective range (task 86), and the critic was receiving 2
  # of 115 inputs (validator round 1).
  reward_scale: 1.0
  reward_clip: 10.0
  crash_penalty: 2.0
