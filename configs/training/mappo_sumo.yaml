id: mappo_sumo
kind: training
description: >-
  MAPPO on SUMO, at the demand just past inverted_tree's junction-limited capacity.
  Same sensing profile and reward weights as mappo_deploysense; only the simulator
  and the demand differ, so a difference in outcome is attributable to the road.

# SUMO rather than highway_env, because SUMO's car-following cannot produce a
# collision: the safe speed is the model rather than a cap applied over it. Measured
# on the same 3-into-1 merge that broke highway_env, at three times capacity for
# 1800 steps with 134 vehicles present, zero collisions. It is also what Vinitsky
# et al. and the Flow benchmarks run on.
simulator: sumo

# 0.1 s, not the 1.0 s the trainer defaults to. The deployment's end-to-end sensing
# latency was measured at p50 96.7 ms over 22,929 ticks, and it could not be
# represented at all at a 1 s step: `SensingBuffer.frame_for_latency` selects whole
# recorded frames and the buffer records once per step, so ANY value in (0, 1.0]
# imposed a full second and overstated the measurement tenfold. It was pinned at 0,
# understating it by 97 ms. At dt 0.1 a `latency_s` of 0.1 selects the frame one
# step back and represents the measured p50 almost exactly.
#
# It also puts the policy's decision rate at 10 Hz rather than 1 Hz, against the
# deployed loop's 30 Hz tick.
#
# EVERY quantity below that is expressed in steps rather than seconds moves with
# this: warmup_steps, duration_steps, rollout_steps, gamma, gae_lambda and
# reward_scale. Each is annotated with the invariant it preserves.
dt: 0.1

# reward_scale 1.0, not the 0.05 the other configs use. At the SUMO operating point
# the team reward is about 0.82 per step for uncommanded traffic over a 600-step
# episode -- the "about 1.28" this comment previously quoted was measured with the
# fairness denominator defect and on the undeclared fleet, and the quantity also
# moves with the episode length. Scaled by 0.05 it becomes 0.041, while the entropy
# bonus at entropy_coef 0.01 and the entropy the policy actually held (4.24) is
# 0.042 -- more than half of the objective, and on the earlier figures 66%. The policy therefore had almost no incentive to
# become deterministic and held 91% of maximum entropy after 400 updates. PPO's
# default coefficients assume a reward of order 1, and reward_clip at 10 already
# bounds the magnitude, so scaling down was not protecting anything.

# Let the network fill before the episode is observed. A vehicle must cover
# 500 + 600 + 900 m before it can arrive, so nothing completes for the first
# hundred seconds and a rollout beginning at t = 0 can see no AV at all.
# 3000 steps at dt 0.1 is the same 300 s of warm-up as 300 steps at dt 1.0.
warmup_steps: 3000

# 600, not the 120 the trainer defaults to. The effect this configuration exists to
# learn -- AVs holding a speed below free flow to raise throughput through the
# junction -- does not exist at 120 steps. Arrivals with every AV commanded to hold
# one speed, five seeds, at this demand and penetration:
#
#   arm            120 steps        600 steps
#   uncommanded    27.8 +/- 3.1     132.0 +/- 6.4
#   8 m/s          24.4 +/- 1.9     148.8 +/- 9.0
#   10 m/s         26.2 +/- 4.3     155.2 +/- 10.5   <- best over the longer episode
#   15 m/s         27.4 +/- 4.0     148.0 +/- 17.1
#   20 m/s         28.4 +/- 4.2     138.8 +/- 10.6
#   24 m/s         28.8 +/- 2.9     137.0 +/- 4.7
#
# At 120 steps no commanded arm beats an uncommanded fleet: the best is 28.8 +/- 2.9
# against 27.8 +/- 3.1, which is noise, and the reward ranks the fastest arms first.
# At 600 steps holding 10 m/s gives 17.6% more arrivals. Training at the default
# length would have run at the one horizon where the effect is absent.
#
# The mean team reward is also a function of the horizon: +1.34 per step uncommanded
# at 120 steps against +0.82 at 600, because `jam_fraction` at weight -2.0 grows as
# the network fills. Any statement of the form "the team reward is about X" needs
# the episode length attached to it.
# 9000 steps at dt 0.1 is a 900 s episode: 200 s of steady demand, a 150 s burst,
# and 550 s to recover. The last of those is what sets the length -- the network
# takes about seven minutes to clear the queue the burst leaves, and an episode that
# ends before it does cannot measure a controller on the recovery.
#
# The arm table this comment used to carry is RETRACTED. It recorded that AVs held
# at 10 m/s complete 155.2 trips against 132.0 uncommanded, a 17.6% gain, and that
# the effect was absent at a 120-step episode. Both were measured at dt 1.0, where
# SUMO integrates the physics in 1 s steps and a vehicle at 24 m/s advances 24 m
# per step. Sweeping the step size (scripts/measure_step_size_convergence.py, five
# seeds, 600 s episodes):
#
#   dt     uncommanded        10 m/s          gain
#   1.0    132.0 +/-  6.4   155.2 +/- 10.5   +17.6%
#   0.5    134.4 +/-  5.9   157.8 +/- 16.0   +17.4%
#   0.2    157.6 +/- 12.3   160.4 +/-  7.2    +1.8%
#   0.1    168.4 +/- 11.3   161.2 +/-  8.6    -4.3%
#   0.05   173.0 +/-  8.4   161.6 +/-  8.6    -6.6%
#
# The commanded arm moves by 6.4 arrivals across a twentyfold change in step size,
# inside its own standard deviation; the uncommanded arm rises 31%. Commanding a
# lower speed was recovering resolution the integration had destroyed. At a
# converged step size, holding AVs at 10 m/s LOWERS throughput.
#
# The full arm table at dt 0.1 is in plans/plan_task_84_sumo_simulator.md and is
# produced by scripts/measure_commanded_arms.py.
duration_steps: 9000

# The calibrated Wiedemann-99 driving model, NOT SUMO's default Krauss. Krauss
# computes a collision-free safe speed exactly and recovers from a disturbance
# immediately, so it produces no capacity drop and there is nothing for a controller
# to recover: a perfect-information oracle could not beat inaction under it. The
# parameters come from the predecessor paper's own calibration appendix
# (arXiv:2506.11973, Appendix A), which tuned them for exactly this reason.
human_model: w99_calibrated

# The one topology section C is scoped to.
topology: inverted_tree

# A medium-high steady state, a burst of extreme traffic, and a fall back to the
# steady state. A controller measured only on a steady state can be judged on one
# thing, how well it holds; this scenario also asks what it does while the network is
# overloaded and how quickly it clears the queue afterwards. Profiled with no AVs at
# dt 0.1: mean speed holds near 19 m/s, falls to 7.5 and the queue peaks at 40
# vehicles four minutes after the burst, then recovers to 17.7 m/s with the queue
# back to 6 by the end of the episode.
demand: sumo_burst

algorithm: mappo
policy_mode: ctde
action_profile: full
total_updates: 100
# One rollout is exactly one episode. `collect_rollout` builds a fresh environment
# and resets at the start of every update, so the policy only ever experiences the
# first `rollout_steps` of an episode: at 512 it saw the first 512 s of a 600 s
# episode and never the last 88, and at dt 0.1 it would have seen the first 51 s of
# 600 -- entirely inside the window where the throughput effect does not yet exist.
rollout_steps: 9000

# Every value here has a named source. `src/sensing/local.py` reads exactly these
# five plus the bin edges, and they define the actor's entire input distribution.
sensing:
  # Optics, not measurement. fx_px is 800 on the rotated frame, so a 1.8 m wide
  # vehicle spans 20 px at 72 m and 14.4 px at 100 m. The 150 m library default
  # puts it at 9.6 px, which is past what the detector resolves. 100 m is the
  # optimistic end of the defensible band and is what shared_ppo_deploysense
  # already used.
  # PENDING: task 9 replaces this with the replay measurement over the recorded
  # video, which needs the Jetson's TensorRT detector and so cannot be done from
  # the laptop.
  range_m: 100.0

  # Measured: end-to-end latency over 22,929 ticks on 2026-09-08 was p50 96.7 ms,
  # mean 112.4 ms, p95 172.9 ms, p99 276.4 ms.
  #
  # 0.1 s represents the p50 almost exactly. `SensingBuffer.frame_for_latency`
  # selects whole recorded frames and the buffer records once per step, so at dt 0.1
  # this selects the frame from one step -- 100 ms -- earlier. It was pinned at 0
  # while dt was 1.0, because at that step size any positive value imposed a full
  # second and overstated the measurement tenfold; the sensing delay was unmodelled
  # rather than represented. The step size was changed for this reason.
  #
  # It is the p50, not the mean or the p95: the buffer holds whole frames, so the
  # delay is a whole number of steps and the distribution's spread is not
  # representable at all. p50 96.7 ms rounds to one step; the p95 of 172.9 ms would
  # round to two.
  latency_s: 0.1

  # NOT measured on this vehicle, and not measurable from these drives:
  # calibrating detection noise needs an independent measurement of other
  # vehicles' true position and speed, and the vehicle carried no radar, no lidar
  # and no second instrumented car. These must never be described as measured
  # here.
  #
  # CITED instead, from Song, Lu, Zhang and Li, "End-to-end Learning for
  # Inter-Vehicle Distance and Relative Velocity Estimation in ADAS with a
  # Monocular Camera", ICRA 2020 (arXiv:2006.04082), evaluated on the TuSimple
  # velocity benchmark. That paper measures exactly this pair of quantities for
  # exactly this sensor -- a forward monocular camera estimating other vehicles'
  # distance and relative velocity -- and reports, for its full model:
  #
  #   position MSE 10.23 m^2                      -> RMSE 3.20 m
  #   velocity MSE 0.86 m^2/s^2 (range-averaged)  -> RMSE 0.93 m/s
  #
  # Its velocity error is range-resolved, and our 100 m sensing range spans all
  # three of its groups: MSE 0.15 near (< 20 m), 0.34 medium (20-45 m), 2.09 far
  # (> 45 m), which are RMSE 0.39, 0.58 and 1.45 m/s. The range-averaged 0.93 is
  # taken rather than the near-range figure because most observed vehicles are
  # beyond 45 m at a 100 m range.
  #
  # These are the errors of a state-of-the-art LEARNED method. This rig runs
  # YOLOv8n with pinhole geometry and vehicle-width priors, which is simpler and
  # will not beat them, so treat the values as a floor on the noise rather than an
  # estimate of it. The previous values, 1.5 m and 0.15 m/s, were carried over
  # from shared_ppo_deploysense with no source and are optimistic against this
  # citation by roughly 2x on position and 6x on speed.
  #
  # Corroborating, for speed only and from a different setup (roadside camera,
  # homography, validated against a GNSS and IMU reference vehicle): Bell et al.,
  # "Accurate Vehicle Speed Estimation from Monocular Camera Footage", ISPRS
  # Annals V-2-2020, average RMSE 0.625 m/s over four experiments, range 0.130 to
  # 1.171 m/s.
  #
  # Measured after setting them, against a noise-free run on the same seed: the
  # injected error on `leader_gap` has a standard deviation of 3.00 m and on
  # `leader_relative_speed` 0.70 m/s over 376 paired observations.
  position_noise_std: 3.2
  speed_noise_std: 0.93

  # Present only what the rig can sense. The parity ledger classifies six of the
  # 39 observation slots as structurally absent -- every rear-facing field, since
  # the live vehicle list is forward-camera derived and there is no rear sensor --
  # and seven more as substituted with a constant. Without this the actor learns
  # from 13 of 39 inputs the deployed vehicle cannot produce.
  deployed_fidelity: true

  # The library default, and the drive supports it rather than contradicting it:
  # ego speed over 17,913 moving ticks is bimodal, with a stop-and-go mass below
  # about 6 m/s and a cruise mode at 22-26 m/s.
  queue_speed_mps: 5.0

# Throughput leads the objective, because that is what the replication claims.
#
# Balanced at the saturating operating point measured on inverted_tree at 2000
# veh/h: mean_speed 10.70, throughput_recent 11.5, jam_fraction 0.108,
# fairness_jain 0.885. With the library defaults those give mean_speed 44% of the
# positive reward and throughput 19%. Raising throughput_recent from 0.02 to 0.10
# makes it 54%, against mean_speed 25% and fairness 21%.
#
# mean_speed is NOT zeroed. throughput_recent counts completions in a 60 s rolling
# window and is zero on most early steps, so it is a sparse signal; the speed term
# is what provides a gradient in between.
#
# jam_fraction doubles to -2.0 so relieving congestion pays. At 0.108 it is still
# only a -0.216 contribution, which is the right order: congestion is the thing to
# relieve, not the thing to be scored on.
reward_weights:
  throughput_recent: 0.10
  jam_fraction: -2.0

actor:
  observation_scope: local
  hidden_sizes:
    - 128
    - 128
critic:
  observation_scope: global
optimization:
  learning_rate: 0.0003
  # 0.999, not 0.99. Both are horizons expressed in steps, and the step changed.
  # 1/(1-gamma) is 100 steps, which was 100 s at dt 1.0 and would be 10 s at dt 0.1
  # -- against a phenomenon that takes 300 s or more to appear. 0.999 restores the
  # 100 s horizon exactly. Whether 100 s is itself long enough is a separate
  # question, and one the previous configuration had too.
  gamma: 0.999
  # 0.995 for the same reason: 1/(1-lambda) is the advantage-averaging horizon, 20
  # steps, which was 20 s and would become 2 s.
  gae_lambda: 0.995
  clip_coef: 0.2
  value_coef: 0.5
  entropy_coef: 0.01
  max_grad_norm: 0.5
  update_epochs: 4
  minibatch_size: 256
  # 0.1 at dt 0.1, which is 1.0 at dt 1.0 -- the scale is per step and the step
  # changed, so this keeps the reward's integral over an episode the same. Without
  # it a 6000-step episode at gamma 0.999 gives value targets ten times larger than
  # a 600-step episode at gamma 0.99, and the value loss is a mean squared error on
  # them, so it would grow a hundredfold and dominate the objective.
  #
  # WHY THE SCALE MATTERS, AND WHAT IT DOES NOT AFFECT. `compute_returns_and_advantages`
  # normalises advantages by default, and `policy_loss` is computed from those, so
  # the policy gradient is invariant to this scale. Only `value_loss` sees it,
  # through unnormalised returns. Task 85's argument -- that at scale 0.05 the
  # entropy bonus of 0.042 was 66% of the objective and left the policy no incentive
  # to become deterministic -- compared the bonus against the raw reward, which is
  # not what the policy loss is built from. That explains the measured outcome:
  # changing the scale moved entropy only from -0.025 to +0.021 over 400 updates.
  # Task 85's arithmetic was right and the quantities it compared were not.
  #
  # CORRECTED 2026-09-09 from a second independent audit. This block previously
  # recorded a team reward of "mean +0.2737, min -0.6442, max +0.9489" over 300
  # steps, which reproduces under no combination of episode length and warm-up: the
  # measured values are +1.1165 at 300 steps with a 300-step warm-up, +1.5451 with
  # none, and +0.8313 over 600 steps -- and the last of those is the figure the
  # header of this file quotes, so the two statements contradicted each other. It
  # also claimed queue_length_total was the largest single term at -1.30; measured
  # over 300 steps the contributions are throughput_recent +1.2437, mean_speed
  # +0.5825, queue_length_total -0.4497, fairness_jain +0.3767, speed_std -0.2192,
  # jam_fraction -0.2083, hard_braking_count -0.1083. Throughput exceeds queue
  # length by a factor of 2.8.
  #
  # All of those figures were measured at dt 1.0 and are superseded by the dt 0.1
  # re-measurement recorded in plans/plan_task_84_sumo_simulator.md.
  reward_scale: 0.1
  reward_clip: 10.0
  crash_penalty: 2.0
