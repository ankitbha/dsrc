id: mappo_src_speed_only
kind: training
description: >-
  The predecessor paper's formulation (arXiv:2506.11973) ported onto this project's
  decentralized execution: a threshold reward at critical density, speed commands in
  the band congested traffic is actually in, one decision a minute, and an
  observation dominated by link state so co-located AVs act coherently.

# WHY THIS CONFIG EXISTS. `mappo_sumo` is kept as it was and is a measured null. The
# gradient measurements behind that null (tasks 105 to 108) said the advantage
# carries no action-attributable signal under any reward, horizon, critic input, bin
# scaling, operating point or penetration. Reading the paper says why, and it is not
# any of those knobs:
#
#   |                    | the paper                    | mappo_sumo                |
#   |--------------------|------------------------------|---------------------------|
#   | agent              | ONE centralized agent        | ~39 independent AVs       |
#   | action             | speed limit for a 2-3 km     | one vehicle's speed bin   |
#   |                    | super-segment                |                           |
#   | speed values       | 30/45/60 km/h = 8.3/12.5/    | 20/27/30 m/s              |
#   |                    | 16.7 m/s                     |                           |
#   | decision interval  | 60 s                         | 1 s                       |
#   | gamma              | 0.9 per minute, ~10 min      | 0.99 per second, 100 s    |
#   | observation        | per-super-segment density,   | per-vehicle kinematics    |
#   |                    | speed, gap, inflow, outflow  |                           |
#
# Its action sets a speed limit over kilometres of road for a whole minute; ours set
# one vehicle's speed for one second. That is the credit-assignment problem, and the
# paper never had it. This config keeps decentralized execution -- each AV still acts
# on its own observation and nothing reads a global state at run time -- and closes
# the other four gaps.
# SPEED-HEAD-ONLY VARIANT. `mappo_src` uses `speed_headway`, so half the action space
# is a headway head. Backpressure is to be implemented by slowing vehicles and not by
# the other heads, and the two heads also split the policy gradient through a shared
# trunk, so a headway head that carries no signal can add variance to the head that
# might. Measured at update 7 of the `mappo_src` run, the speed head's mean
# probabilities are 0.3272/0.3330/0.3398 against a uniform 0.3333 -- entropy 1.0985 of
# a 1.0986 maximum -- while the headway head sits at 0.2968/0.3945/0.3087, so the whole
# departure from uniform is in the head that is not supposed to act.
#
# This variant exists to ask the gradient instrument whether removing that head
# restores an action-attributable signal, which costs minutes, rather than to ask a
# training run, which costs hours.
simulator: sumo
dt: 0.1
topology: inverted_tree
human_model: w99_calibrated
demand: sumo_capacity_drop
algorithm: mappo
policy_mode: ctde
action_profile: speed_only

# ONE DECISION A MINUTE, as the paper does, holding the action for 600 simulation
# steps. This is the macroscopic lever: at one decision a second, neighbouring
# vehicles change their minds independently and out of phase, and the fleet-wide
# action mix sits at 0.307 with a standard deviation of 0.008 -- a three-point window
# out of a 0-to-1 range. Too fine a control resolution is noise.
decision_interval_s: 60.0

# 300 s of fill, then 1200 s observed, which is 20 decisions per episode. The paper
# runs 1200 to 2500 s episodes.
warmup_steps: 3000
duration_steps: 12000
# TWO episodes per update: 40 decisions at 20 per episode. An episode is 15000
# simulation steps and costs about 113 s, so this is roughly 4 minutes per update.
rollout_steps: 40
total_updates: 20

# ABSOLUTE speed values in m/s, not the contract's `free_flow + offset`. 8.33, 12.5
# and 16.67 are the paper's 30, 45 and 60 km/h. The contract's bins are 20, 27 and
# 30 m/s at a 30 m/s limit; measured over 114,889 AV-steps at a mean AV speed of
# 7.33 m/s, all three do the same thing on 84% of them, because `setSpeed` is an
# upper bound SUMO's car-following already dominates.
speed_bins_mps:
  slow: 8.33
  nominal: 12.5
  fast: 16.67

# THE PAPER'S REWARD: a step penalty for a link past critical density, plus a linear
# speed reward, summed over segments. Two terms, not eleven.
#
# The eleven-term weighted reward is not merely more complicated: a continuous
# `jam_fraction` penalty pays a little everywhere, so a policy is rewarded for
# relieving congestion it has already failed to prevent. A step at rho* pays for
# keeping the link BELOW it, which is the anticipatory behaviour the mechanism needs.
# It is also what the metering oracle got wrong -- it triggered on jam_fraction >
# 0.25, by which time the capacity drop has happened.
reward_kind: threshold
threshold_reward:
  # One unit per congested segment per decision.
  congestion_penalty: 1.0
  # 0.05 x a mean speed of about 12 m/s is 0.6 per segment, so a segment tipping over
  # critical costs roughly what a 20 m/s speed drop on it would. The two terms are
  # the same order, which is what makes a threshold worth crossing back over.
  speed_weight: 0.05
  critical_ratio: 0.3

sensing:
  range_m: 100.0
  latency_s: 0.1
  position_noise_std: 3.2
  speed_noise_std: 0.93
  # False, as in mappo_sumo: sim-to-real transfer is deferred work and masking a
  # third of the observation while the prior question is unanswered confounds
  # "cannot learn" with "cannot learn from what the rig senses".
  deployed_fidelity: false
  queue_speed_mps: 5.0

actor:
  observation_scope: local
  hidden_sizes:
    - 128
    - 128
critic:
  observation_scope: global
optimization:
  learning_rate: 0.0003
  # 0.9 per DECISION, and a decision is a minute, so the horizon is about ten
  # minutes -- the paper's value and the paper's unit.
  gamma: 0.9
  gae_lambda: 0.95
  clip_coef: 0.2
  value_coef: 0.5
  entropy_coef: 0.01
  max_grad_norm: 0.5
  update_epochs: 4
  minibatch_size: 256
  # The reward is now summed over 10 segments per simulation step and a decision
  # holds for 600 of them, so a decision carries roughly 600 x 6 = 3600 before
  # scaling. 0.002 brings that to about 7 per decision, which at gamma 0.9 gives
  # value targets near 70 -- the same order the previous configuration ran at.
  reward_scale: 0.002
  reward_clip: 100.0
  crash_penalty: 2.0
  # The per-agent term is off: it was measured not to raise the policy gradient, and
  # the change this configuration is testing is the size of the lever, not the
  # attribution of credit. One change at a time now that there is a reason to expect
  # a difference.
  local_reward_weight: 0.0
